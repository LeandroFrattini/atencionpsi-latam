<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conectar WhatsApp a la API</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 3rem auto; padding: 0 1rem; color: #1c2b2a; line-height: 1.5; }
  button { font: inherit; font-weight: 600; padding: .75rem 1.25rem; border: 0; border-radius: 6px; background: #1877f2; color: #fff; cursor: pointer; }
  button:focus-visible { outline: 3px solid #0a3d91; outline-offset: 2px; }
  pre { background: #f2f5f5; padding: 1rem; border-radius: 6px; overflow-x: auto; font-size: .85rem; }
</style>
</head>
<body>
<h1>Conectar el número de WhatsApp a la API</h1>
<p>Tené abierta la app WhatsApp Business en el celular del número. Cuando te lo pida, ingresá ese número y confirmá desde el celular.</p>
<button id="conectar">Conectar número</button>
<h2>Resultado</h2>
<pre id="log">Esperando…</pre>

<script>
  const log = (t) => { document.getElementById('log').textContent += '\n' + t; };
  let sessionInfo = {};

  window.fbAsyncInit = function () {
    FB.init({ appId: '{{ app_id }}', autoLogAppEvents: true, xfbml: true, version: 'v25.0' });
  };

  // Meta envía los IDs (waba_id, phone_number_id) por este evento
  window.addEventListener('message', (event) => {
    if (!event.origin.endsWith('facebook.com')) return;
    try {
      const data = JSON.parse(event.data);
      if (data.type === 'WA_EMBEDDED_SIGNUP') {
        log('Evento: ' + data.event + ' ' + JSON.stringify(data.data));
        if (data.data && data.data.waba_id) sessionInfo = data.data;
      }
    } catch (e) { /* mensajes que no son JSON */ }
  });

  function csrf() {
    const m = document.cookie.match(/csrftoken=([^;]+)/);
    return m ? m[1] : '';
  }

  document.getElementById('conectar').addEventListener('click', () => {
    FB.login((response) => {
      if (!response.authResponse || !response.authResponse.code) {
        log('Se canceló o no volvió el código: ' + JSON.stringify(response));
        return;
      }
      // Pequeña espera para que llegue el evento con los IDs
      setTimeout(() => {
        fetch('{% url "wa_coexistencia_callback" %}', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrf() },
          body: JSON.stringify({ code: response.authResponse.code, ...sessionInfo }),
        })
          .then(r => r.json())
          .then(j => log('Servidor: ' + JSON.stringify(j, null, 2)))
          .catch(e => log('Error: ' + e));
      }, 1500);
    }, {
      config_id: '{{ config_id }}',
      response_type: 'code',
      override_default_response_type: true,
      extras: {
        setup: {},
        featureType: 'whatsapp_business_app_onboarding',
        sessionInfoVersion: '3'
      }
    });
  });
</script>
<script async defer crossorigin="anonymous" src="https://connect.facebook.net/es_LA/sdk.js"></script>
</body>
</html>
